services:
  postgres:
    image: postgres:16-alpine
    container_name: eudi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eudi
      POSTGRES_USER: eudi
      POSTGRES_PASSWORD: eudi
    ports:
      - "5432:5432"
    volumes:
      - eudi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eudi -d eudi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eudi_postgres_data:
    driver: local
